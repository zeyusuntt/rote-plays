schema_version = 1

[[tools]]
id = "python3"
command = "python3"
required = true

[[tools.install]]
manager = "brew"
package = "python@3"

[[tools.install]]
manager = "apt"
package = "python3"

[[tools.install]]
manager = "system"
notes = "Any Python 3.9+ on PATH; both resource scripts are stdlib-only (json, math, os, re, stat, sys, collections.Counter). Reading ~/.codex/config.toml needs the stdlib tomllib module, which only ships from Python 3.11 onward -- on an older interpreter (the machine this play was built and tested on runs Python 3.10, so this fallback path is exercised, not just theoretical) that one source degrades to a narrow fallback TOML reader instead of losing codex coverage, extended from mcp-doctor's own fallback to also read [mcp_servers.<name>.env] KEY = \"value\" / KEY = 'value' assignments (still only simple quoted strings -- anything else in an env table degrades by being skipped, not guessed). This play ports mcp-doctor's discovery paths/parsers/TOML-fallback verbatim (see discover_configs.py's module docstring for the one deliberate deviation: disabled server blocks are included here, since a secrets audit's job does not depend on whether a harness currently loads the block). Never spawns a server, never makes a network call -- strictly file reads and one os.stat() per config path."
