schema_version = 1

[[tools]]
id = "python3"
command = "python3"
required = true

[[tools.install]]
manager = "brew"
package = "python@3"

[[tools.install]]
manager = "apt"
package = "python3"

[[tools.install]]
manager = "system"
notes = "Any Python 3.9+ on PATH; scan_exposure.py is stdlib-only (json, os, re, shutil, stat, subprocess, sys, time, concurrent.futures, urllib.parse) and never shells out except to git itself."

[[tools]]
id = "git"
command = "git"
required = true

[[tools.install]]
manager = "brew"
package = "git"

[[tools.install]]
manager = "apt"
package = "git"

[[tools.install]]
manager = "system"
notes = "Any reasonably modern git (2.x) on PATH -- only `config --get-all`, `remote -v`, and (for scan_global) reading ~/.git-credentials directly are used, all long-standing, ordinary features with no version floor of their own. Only read commands are issued, always with --no-optional-locks and a scrubbed environment. git missing from PATH degrades only the global credential.helper check in scan_global (the ~/.git-credentials file scan needs no git binary at all) but fails scan_repos closed entirely, since every one of its per-repo checks is a git call."
